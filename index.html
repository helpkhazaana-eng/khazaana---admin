<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khazaana Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:linear-gradient(135deg,#050505,#111);color:white;padding:30px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:20px}
.logo{font-size:36px;font-weight:700;color:#ff9a1f}
.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notificationBtn{background:#25D366;color:white;border:none;padding:14px 20px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer}
.notificationBtn.enabled{background:#3b82f6}
.notificationStatus{font-size:12px;color:#aaa}
.stats{display:flex;gap:15px;flex-wrap:wrap}
.stat-card{background:#181818;padding:20px 25px;border-radius:20px;border:1px solid #2b2b2b;min-width:160px}
.stat-card h3{font-size:14px;color:#999;margin-bottom:10px}
.stat-card p{font-size:28px;font-weight:700}
.orders-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:25px}
.order-card{background:linear-gradient(145deg,#181818,#101010);border-radius:28px;padding:25px;border:1px solid #2a2a2a;box-shadow:0 0 30px rgba(0,0,0,.35);transition:.3s}
.order-card:hover{transform:translateY(-4px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.customer{font-size:30px;font-weight:700}
.status{padding:8px 18px;border-radius:30px;font-size:12px;font-weight:700;text-transform:capitalize;white-space:nowrap}
.pending{background:#ffb020;color:#000}.accepted{background:#25D366;color:#fff}.delivered{background:#3b82f6;color:#fff}.out{background:#ff9a1f;color:#fff}.cancelled{background:#ff4d4f;color:#fff}
.info{margin:14px 0;font-size:15px;display:flex;align-items:center;gap:10px;color:#ddd}
.phone{color:#25D366;font-weight:600}
.items-box{margin-top:20px;background:#0b0b0b;padding:20px;border-radius:18px}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1d1d1d}
.item:last-child{border-bottom:none}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}
button{border:none;padding:15px;border-radius:18px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
button:hover{transform:scale(1.02);opacity:.92}
.acceptBtn{background:#25D366;color:#fff}.deliveryBtn{background:#ff9a1f;color:#fff}.deliverBtn{background:#3b82f6;color:#fff}.deleteBtn{background:#ff4d4f;color:#fff}
.date{margin-top:12px;font-size:13px;color:#aaa;padding:10px 12px;background:#0b0b0b;border-radius:12px}
.empty{text-align:center;margin-top:120px;font-size:30px;color:#777}
@media(max-width:768px){
 body{padding:18px}.logo{font-size:28px}.customer{font-size:24px}
 .orders-grid{grid-template-columns:1fr}.header-actions{width:100%}
 .notificationBtn{width:100%}.notificationStatus{width:100%}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">Khazaana Admin Panel</div>

  <div class="header-actions">
    <button id="notificationBtn" class="notificationBtn">
      🔔 Enable Order Notifications
    </button>
    <div id="notificationStatus" class="notificationStatus">
      Notifications not enabled
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>
    <div class="stat-card">
      <h3>Revenue</h3>
      <p id="revenue">₹0</p>
    </div>
  </div>
</div>

<div class="orders-grid" id="orders">
  <div class="empty">Loading Orders...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
  getMessaging,
  getToken,
  onMessage,
  isSupported
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUZxP--9ycqK5oom_CZMVH5imyes_aKHU",
  authDomain: "khazaana-7088c.firebaseapp.com",
  projectId: "khazaana-7088c",
  storageBucket: "khazaana-7088c.firebasestorage.app",
  messagingSenderId: "988898941531",
  appId: "1:988898941531:web:851a3d3db24c85e9fa3d7e"
};

const VAPID_PUBLIC_KEY =
  "BCsYG8ccnAT3Qz0oSQdYXWHv4Rr9RUBWwAx-ZPzzFiXVXRtLbMuvieytyegKuEcXF1wK1Jd47uLyZ9yI-dpWd1M";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ordersBox = document.getElementById("orders");
const notificationBtn = document.getElementById("notificationBtn");
const notificationStatus = document.getElementById("notificationStatus");

let messaging = null;

async function setupMessaging() {
  try {
    const supported = await isSupported();
    if (!supported) {
      notificationStatus.textContent = "Web push is not supported in this browser";
      notificationBtn.disabled = true;
      return;
    }
    messaging = getMessaging(app);
  } catch (error) {
    console.error("FCM support error:", error);
    notificationStatus.textContent = "Notifications unavailable";
    notificationBtn.disabled = true;
  }
}

async function enableNotifications() {
  try {
    if (!messaging) await setupMessaging();
    if (!messaging) return;

    if (!window.isSecureContext) {
      alert("Notifications require HTTPS. Open the Admin Panel using its HTTPS address.");
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      notificationStatus.textContent = "Notification permission was not granted";
      alert("Please allow notifications for the Khazaana Admin Panel.");
      return;
    }

    const registration = await navigator.serviceWorker.register(
      "./firebase-messaging-sw.js"
    );

    const token = await getToken(messaging, {
      vapidKey: VAPID_PUBLIC_KEY,
      serviceWorkerRegistration: registration
    });

    if (!token) {
      throw new Error("Firebase did not return a notification token.");
    }

    // Use a URL-safe document ID so this browser/device can be updated
    // instead of creating a new device record every time.
    const deviceId = encodeURIComponent(token);

    await setDoc(doc(db, "adminDevices", deviceId), {
      token: token,
      platform: navigator.platform || "unknown",
      userAgent: navigator.userAgent,
      enabled: true,
      lastSeen: new Date().toISOString()
    }, { merge: true });

    notificationBtn.textContent = "🔔 Notifications Enabled";
    notificationBtn.classList.add("enabled");
    notificationStatus.textContent = "This device will receive new-order alerts.";

    console.log("FCM token registered:", token);
  } catch (error) {
    console.error("Notification setup error:", error);
    notificationStatus.textContent = "Could not enable notifications";
    alert("Could not enable notifications:\n" + error.message);
  }
}

notificationBtn.addEventListener("click", enableNotifications);

setupMessaging();

// If the Admin Panel is already open when an order notification arrives,
// show a browser notification as well.
(async () => {
  try {
    if (!messaging) await setupMessaging();
    if (!messaging) return;

    onMessage(messaging, async (payload) => {
      console.log("Foreground FCM message:", payload);

      const title = payload.notification?.title || "🔔 NEW Khazaana ORDER";
      const body = payload.notification?.body || "A new order has arrived.";

      if (Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          icon: "./icon.png"
        });
      }
    });
  } catch (error) {
    console.error("Foreground messaging error:", error);
  }
})();

ordersBox.addEventListener("click", async (event) => {
  const button = event.target.closest(".deleteBtn");
  if (!button) return;

  const id = button.dataset.deleteId;

  if (!confirm("Are you sure you want to delete this order?")) return;

  try {
    await deleteDoc(doc(db, "orders", id));
    alert("Order deleted successfully.");
  } catch (error) {
    console.error("Delete error:", error);
    alert("Failed to delete order: " + error.message);
  }
});

function formatDateTime(value) {
  if (!value) return "Date not available";

  try {
    let date;

    if (value && typeof value.toDate === "function") {
      date = value.toDate();
    } else if (value && typeof value === "object" && value.seconds) {
      date = new Date(value.seconds * 1000);
    } else {
      date = new Date(value);
    }

    if (Number.isNaN(date.getTime())) return String(value);

    return date.toLocaleString("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    });
  } catch (error) {
    return String(value);
  }
}

onSnapshot(
  collection(db, "orders"),
  (snapshot) => {

    ordersBox.innerHTML = "";

    let totalOrders = 0;
    let revenue = 0;

    if (snapshot.empty) {
      ordersBox.innerHTML = '<div class="empty">No Orders Found</div>';
      document.getElementById("totalOrders").innerText = "0";
      document.getElementById("revenue").innerText = "₹0";
      return;
    }

    snapshot.forEach((orderDoc) => {

      const data = orderDoc.data();
      const id = orderDoc.id;

      totalOrders++;
      revenue += Number(data.total || 0);

      let itemsHTML = "";

      if (Array.isArray(data.items)) {
        data.items.forEach(item => {
          itemsHTML += `
            <div class="item">
              <span>${item.name} x${item.qty}</span>
              <span>₹${item.total}</span>
            </div>
          `;
        });
      }

      const statusClass =
        data.status === "Accepted" ? "accepted" :
        data.status === "Out For Delivery" ? "out" :
        data.status === "Delivered" ? "delivered" :
        data.status === "Cancelled" ? "cancelled" :
        "pending";

      ordersBox.innerHTML += `
        <div class="order-card">

          <div class="top">
            <div class="customer">
              ${data.customer || data.customerName || "Customer"}
            </div>

            <div class="status ${statusClass}">
              ${data.status || "Pending"}
            </div>
          </div>

          <div class="info">📍 ${data.address || ""}</div>
          <div class="info">🍴 ${data.restaurant || ""}</div>
          <div class="info phone">📞 ${data.phone || ""}</div>
          <div class="info">💰 ₹${data.total || 0}</div>

          <div class="date">
            🕒 Order Date & Time:
            ${formatDateTime(data.date || data.orderDateTime || data.createdAt)}
          </div>

          ${data.deliveredAt ? `
            <div class="date">
              ✅ Delivered:
              ${formatDateTime(data.deliveredAt)}
            </div>
          ` : ""}

          <div class="items-box">
            ${itemsHTML}
          </div>

          <div class="buttons">

            <button class="acceptBtn"
              onclick="acceptOrder('${id}')">
              Accept
            </button>

            <button class="deliveryBtn"
              onclick="outForDelivery('${id}')">
              Out For Delivery
            </button>

            <button class="deliverBtn"
              onclick="deliverOrder('${id}')">
              Delivered
            </button>

            <button class="deleteBtn"
              data-delete-id="${id}">
              Delete
            </button>

          </div>

        </div>
      `;
    });

    document.getElementById("totalOrders").innerText = totalOrders;
    document.getElementById("revenue").innerText = "₹" + revenue;
  },
  (error) => {
    alert(error.message);
    console.error(error);
  }
);

window.acceptOrder = async (id) => {
  await updateDoc(doc(db, "orders", id), {
    status: "Accepted"
  });
};

window.outForDelivery = async (id) => {
  await updateDoc(doc(db, "orders", id), {
    status: "Out For Delivery"
  });
};

window.deliverOrder = async (id) => {
  await updateDoc(doc(db, "orders", id), {
    status: "Delivered",
    deliveredAt: new Date()
  });
};

</script>
</body>
</html>
