<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Khazaana Admin Panel</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  background:
  linear-gradient(
    135deg,
    #050505,
    #111111
  );

  color:white;
  padding:30px;
  min-height:100vh;

}

.header{

  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  flex-wrap:wrap;
  gap:20px;

}

.logo{

  font-size:36px;
  font-weight:700;
  color:#ff9a1f;

}

.stats{

  display:flex;
  gap:15px;
  flex-wrap:wrap;

}

.stat-card{

  background:#181818;
  padding:20px 25px;
  border-radius:20px;
  border:1px solid #2b2b2b;
  min-width:160px;

}

.stat-card h3{

  font-size:14px;
  color:#999;
  margin-bottom:10px;

}

.stat-card p{

  font-size:28px;
  font-weight:700;

}

.orders-grid{

  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(380px,1fr));
  gap:25px;

}

.order-card{

  background:
  linear-gradient(
    145deg,
    #181818,
    #101010
  );

  border-radius:28px;
  padding:25px;
  border:1px solid #2a2a2a;

  box-shadow:
  0 0 30px rgba(0,0,0,0.35);

  transition:0.3s;

}

.order-card:hover{

  transform:translateY(-4px);

}

.top{

  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;

}

.customer{

  font-size:30px;
  font-weight:700;

}

.status{

  padding:8px 18px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
  text-transform:capitalize;

}

.pending{

  background:#ffb020;
  color:black;

}

.accepted{

  background:#25D366;
  color:white;

}

.delivered{

  background:#3b82f6;
  color:white;

}

.out{

  background:#ff9a1f;
  color:white;

}

.cancelled{

  background:#ff4d4f;
  color:white;

}

.info{

  margin:14px 0;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#ddd;

}

.phone{

  color:#25D366;
  font-weight:600;

}

.items-box{

  margin-top:20px;
  background:#0b0b0b;
  padding:20px;
  border-radius:18px;

}

.item{

  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #1d1d1d;

}

.item:last-child{

  border-bottom:none;

}

.buttons{

  display:grid;
  grid-template-columns:
  repeat(2,1fr);
  gap:14px;
  margin-top:24px;

}

button{

  border:none;
  padding:15px;
  border-radius:18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;

}

button:hover{

  transform:scale(1.02);
  opacity:0.92;

}

.acceptBtn{

  background:#25D366;
  color:white;

}

.deliveryBtn{

  background:#ff9a1f;
  color:white;

}

.deliverBtn{

  background:#3b82f6;
  color:white;

}

.deleteBtn{

  background:#ff4d4f;
  color:white;

}

.date{

  margin-top:12px;
  font-size:13px;
  color:#aaa;
  padding:10px 12px;
  background:#0b0b0b;
  border-radius:12px;

}

.empty{

  text-align:center;
  margin-top:120px;
  font-size:30px;
  color:#777;

}

@media(max-width:768px){

  body{

    padding:18px;

  }

  .logo{

    font-size:28px;

  }

  .customer{

    font-size:24px;

  }

  .orders-grid{

    grid-template-columns:1fr;

  }

}

</style>

</head>


<body>


<div class="header">

  <div class="logo">
    Khazaana Admin Panel
  </div>


  <div class="stats">

    <div class="stat-card">

      <h3>
        Total Orders
      </h3>

      <p id="totalOrders">
        0
      </p>

    </div>


    <div class="stat-card">

      <h3>
        Revenue
      </h3>

      <p id="revenue">
        ₹0
      </p>

    </div>

  </div>

</div>


<div
  class="orders-grid"
  id="orders"
>

  <div class="empty">
    Loading Orders...
  </div>

</div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


import {
  getMessaging,
  getToken,
  onMessage
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-messaging.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyB_UipI_NKsbMWrmqCh26t_L7lBbRRw3GE",

  authDomain:
    "khazaana-7088c.firebaseapp.com",

  projectId:
    "khazaana-7088c",

  storageBucket:
    "khazaana-7088c.firebasestorage.app",

  messagingSenderId:
    "988898941531",

  appId:
    "1:988898941531:web:851a3d3db24c85e9fa3d7e"

};



/* =========================================================
   FCM VAPID PUBLIC KEY
========================================================= */

const VAPID_PUBLIC_KEY =
  "BCsYG8ccnAT3Qz0oSQdYXWHv4Rr9RUBWwAx-ZPzzFiXVXRtLbMuvieytyegKuEcXF1wK1Jd47uLyZ9yI-dpWd1M";



/* =========================================================
   INITIALIZE
========================================================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const messaging =
  getMessaging(app);

const ordersBox =
  document.getElementById("orders");



/* =========================================================
   FCM / NOTIFICATIONS
========================================================= */

async function setupNotifications(){

  try{

    console.log(
      "🔔 Starting FCM setup..."
    );


    if(
      !("Notification" in window)
    ){

      console.warn(
        "Notifications are not supported."
      );

      return;

    }


    /*
      Ask for notification permission
    */

    const permission =
      await Notification.requestPermission();


    console.log(
      "Notification permission:",
      permission
    );


    if(
      permission !== "granted"
    ){

      console.warn(
        "Notification permission was not granted."
      );

      return;

    }


    /*
      Register Firebase Messaging
      Service Worker.

      On GitHub Pages this resolves to:

      /khazaana---admin/firebase-messaging-sw.js
    */

    const registration =
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js",
        {
          scope:
            "./"
        }
      );


    console.log(
      "✅ Firebase Messaging Service Worker registered:",
      registration
    );


    /*
      Wait until Service Worker is ready
    */

    const serviceWorker =
      await navigator.serviceWorker.ready;


    console.log(
      "✅ Service Worker ready"
    );


    /*
      Get FCM token
    */

    const token =
      await getToken(
        messaging,
        {
          vapidKey:
            VAPID_PUBLIC_KEY,

          serviceWorkerRegistration:
            serviceWorker
        }
      );


    if(!token){

      console.warn(
        "⚠️ No FCM token was generated."
      );

      return;

    }


    console.log(
      "✅ FCM token generated:"
    );

    console.log(token);


    /*
      Save admin device token.

      Token becomes the Firestore
      document ID.

      merge:true prevents overwriting
      unrelated fields.
    */

    const tokenDoc =
      doc(
        db,
        "adminDevices",
        encodeURIComponent(token)
      );


    await setDoc(
      tokenDoc,
      {

        token:
          token,

        platform:
          "web",

        userAgent:
          navigator.userAgent,

        enabled:
          true,

        lastSeen:
          new Date().toISOString()

      },
      {
        merge:true
      }
    );


    console.log(
      "✅ Admin FCM device registered in adminDevices."
    );

  }

  catch(error){

    console.error(
      "❌ FCM setup error:",
      error
    );

  }

}



/* =========================================================
   FOREGROUND NOTIFICATION
========================================================= */

onMessage(
  messaging,
  (payload)=>{

    console.log(
      "🔔 FCM message received:",
      payload
    );


    const title =
      payload?.notification?.title ||
      "🔔 New Khazaana Order";


    const body =
      payload?.notification?.body ||
      "A new order has been received.";


    if(
      Notification.permission ===
      "granted"
    ){

      new Notification(
        title,
        {

          body:
            body,

          icon:
            "./icon.png",

          tag:
            "khazaana-new-order"

        }
      );

    }

  }
);



/*
  Start FCM
*/

setupNotifications();



/* =========================================================
   DATE FORMAT
========================================================= */

function formatDateTime(value){

  if(!value){

    return "Date not available";

  }


  try{

    let date;


    if(
      value &&
      typeof value.toDate ===
      "function"
    ){

      date =
        value.toDate();

    }

    else if(
      value &&
      typeof value ===
      "object" &&
      value.seconds
    ){

      date =
        new Date(
          value.seconds * 1000
        );

    }

    else{

      date =
        new Date(value);

    }


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return String(value);

    }


    return date.toLocaleString(
      "en-IN",
      {

        day:
          "2-digit",

        month:
          "short",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          true

      }
    );

  }

  catch(error){

    return String(value);

  }

}



/* =========================================================
   ARCHIVE ORDER
========================================================= */

async function archiveOrder(id){

  try{

    /*
      DO NOT DELETE.

      Keep the order in Firebase so
      Khazaana OS can continue using
      the historical order data.
    */

    await updateDoc(
      doc(
        db,
        "orders",
        id
      ),
      {

        archived:
          true,

        archivedAt:
          new Date()

      }
    );


    console.log(
      "✅ Order archived:",
      id
    );

  }

  catch(error){

    console.error(
      "❌ Archive error:",
      error
    );


    alert(
      "Failed to remove order: " +
      error.message
    );

  }

}



/* =========================================================
   DELETE BUTTON
========================================================= */

ordersBox.addEventListener(
  "click",
  async(event)=>{

    const button =
      event.target.closest(
        ".deleteBtn"
      );


    if(!button){

      return;

    }


    const id =
      button.dataset.deleteId;


    if(
      !confirm(
        "Remove this order from the Admin Panel?"
      )
    ){

      return;

    }


    await archiveOrder(id);

  }
);



/* =========================================================
   REAL-TIME ORDERS
========================================================= */

onSnapshot(

  collection(
    db,
    "orders"
  ),

  (snapshot)=>{

    ordersBox.innerHTML = "";


    let totalOrders = 0;

    let revenue = 0;


    /*
      Process orders
    */

    snapshot.forEach(
      (orderDoc)=>{

        const data =
          orderDoc.data();


        /*
          Archived orders stay in Firebase
          but are hidden from Admin Panel.
        */

        if(
          data.archived === true
        ){

          return;

        }


        const id =
          orderDoc.id;


        /*
          Add timestamp to old orders
          if necessary.
        */

        if(
          !data.createdAt &&
          !data.orderDateTime
        ){

          updateDoc(
            doc(
              db,
              "orders",
              id
            ),
            {

              createdAt:
                new Date()

            }
          ).catch(
            error =>
              console.error(
                "Timestamp error:",
                error
              )
          );

        }


        totalOrders++;

        revenue +=
          Number(
            data.total || 0
          );


        let itemsHTML =
          "";


        if(
          Array.isArray(
            data.items
          )
        ){

          data.items.forEach(
            item=>{

              itemsHTML += `

                <div class="item">

                  <span>
                    ${item.name} x${item.qty}
                  </span>

                  <span>
                    ₹${item.total}
                  </span>

                </div>

              `;

            }
          );

        }


        /*
          Status class
        */

        let statusClass =
          "pending";


        if(
          data.status ===
          "Accepted"
        ){

          statusClass =
            "accepted";

        }

        else if(
          data.status ===
          "Out For Delivery"
        ){

          statusClass =
            "out";

        }

        else if(
          data.status ===
          "Delivered"
        ){

          statusClass =
            "delivered";

        }

        else if(
          data.status ===
          "Cancelled"
        ){

          statusClass =
            "cancelled";

        }


        /*
          Create order card
        */

        ordersBox.innerHTML += `

          <div class="order-card">


            <div class="top">

              <div class="customer">

                ${
                  data.customer ||
                  data.customerName ||
                  "Customer"
                }

              </div>


              <div
                class="status ${statusClass}"
              >

                ${
                  data.status ||
                  "Pending"
                }

              </div>

            </div>



            <div class="info">

              📍

              ${
                data.address ||
                ""
              }

            </div>



            <div class="info">

              🍴

              ${
                data.restaurant ||
                ""
              }

            </div>



            <div class="info phone">

              📞

              ${
                data.phone ||
                ""
              }

            </div>



            <div class="info">

              💰

              ₹${
                data.total ||
                0
              }

            </div>



            <div class="date">

              🕒
              Order Date & Time:

              ${
                formatDateTime(
                  data.orderDateTime ||
                  data.createdAt
                )
              }

            </div>



            ${
              data.deliveredAt
              ?

              `

              <div class="date">

                ✅
                Delivered:

                ${
                  formatDateTime(
                    data.deliveredAt
                  )
                }

              </div>

              `

              :

              ""
            }



            <div class="items-box">

              ${
                itemsHTML ||
                `
                <div class="item">
                  <span>
                    Order details unavailable
                  </span>
                </div>
                `
              }

            </div>



            <div class="buttons">


              <button
                class="acceptBtn"
                onclick="
                  acceptOrder('${id}')
                "
              >

                Accept

              </button>



              <button
                class="deliveryBtn"
                onclick="
                  outForDelivery('${id}')
                "
              >

                Out For Delivery

              </button>



              <button
                class="deliverBtn"
                onclick="
                  deliverOrder('${id}')
                "
              >

                Delivered

              </button>



              <button
                class="deleteBtn"
                data-delete-id="${id}"
              >

                Delete

              </button>


            </div>


          </div>

        `;

      }
    );


    /*
      Dashboard numbers
    */

    document.getElementById(
      "totalOrders"
    ).innerText =
      totalOrders;


    document.getElementById(
      "revenue"
    ).innerText =
      "₹" + revenue;


    /*
      All active orders archived
    */

    if(
      totalOrders === 0
    ){

      ordersBox.innerHTML =
        `
        <div class="empty">
          No Active Orders
        </div>
        `;

    }

  },

  (error)=>{

    console.error(
      "❌ Firestore error:",
      error
    );

    alert(
      error.message
    );

  }

);



/* =========================================================
   ACCEPT
========================================================= */

window.acceptOrder =
async(id)=>{

  try{

    await updateDoc(
      doc(
        db,
        "orders",
        id
      ),
      {

        status:
          "Accepted"

      }
    );

  }

  catch(error){

    console.error(
      "Accept error:",
      error
    );

  }

};



/* =========================================================
   OUT FOR DELIVERY
========================================================= */

window.outForDelivery =
async(id)=>{

  try{

    await updateDoc(
      doc(
        db,
        "orders",
        id
      ),
      {

        status:
          "Out For Delivery"

      }
    );

  }

  catch(error){

    console.error(
      "Out For Delivery error:",
      error
    );

  }

};



/* =========================================================
   DELIVERED
========================================================= */

window.deliverOrder =
async(id)=>{

  try{

    await updateDoc(
      doc(
        db,
        "orders",
        id
      ),
      {

        status:
          "Delivered",

        deliveredAt:
          new Date()

      }
    );

  }

  catch(error){

    console.error(
      "Delivered error:",
      error
    );

  }

};


</script>

</body>

</html>
